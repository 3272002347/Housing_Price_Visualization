<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房价可视化系统 - 用户注册</title>
    <style>
        /* 全局样式（和登录页完全一致） */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .register-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .register-title {
            text-align: center;
            margin-bottom: 35px;
        }
        .register-title h1 {
            font-size: 24px;
            color: #1d2129;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .register-title p {
            font-size: 14px;
            color: #86909c;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #4e5969;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            height: 44px;
            padding: 0 15px;
            border: 1px solid #c9cdd4;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            border-color: #165DFF;
            outline: none;
            box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.1);
        }
        .form-group input::placeholder {
            color: #c9cdd4;
        }
        .register-btn {
            width: 100%;
            height: 48px;
            background-color: #165DFF;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .register-btn:hover {
            background-color: #0d47a1;
        }
        .login-link {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #86909c;
        }
        .login-link a {
            color: #165DFF;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        .error-msg {
            background-color: #fef0f0;
            color: #f53f3f;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            border: 1px solid #fde2e2;
        }
        .success-msg {
            background-color: #f0f9ff;
            color: #165DFF;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            border: 1px solid #e6f7ff;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #c9cdd4;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <div class="register-title">
            <h1>房价可视化系统</h1>
            <p>用户注册</p>
        </div>

        <!-- 提示信息 -->
        {% if messages %}
            {% for msg in messages %}
                {% if 'error' in msg.tags %}
                    <div class="error-msg">{{ msg }}</div>
                {% else %}
                    <div class="success-msg">{{ msg }}</div>
                {% endif %}
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'register' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请设置用户名" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请设置密码（至少8位）" required>
            </div>
            <div class="form-group">
                <label for="password2">确认密码</label>
                <input type="password" id="password2" name="password2" placeholder="请再次输入密码" required>
            </div>

            <button type="submit" class="register-btn">注册</button>
        </form>

        <div class="login-link">
            已有账号？<a href="{% url 'login' %}">立即登录</a>
        </div>
    </div>

    <div class="footer">
        © 2026 基于Django的房价信息可视化系统 | 毕业设计
    </div>
</body>
</html>
