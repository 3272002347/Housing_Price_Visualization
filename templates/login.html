<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>房价可视化系统 - 用户登录</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", "PingFang SC", sans-serif;
        }

        /* 页面背景 */
        body {
            background-color: #f5f7fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 登录卡片 */
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* 标题区域 */
        .login-title {
            text-align: center;
            margin-bottom: 35px;
        }
        .login-title h1 {
            font-size: 24px;
            color: #1d2129;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .login-title p {
            font-size: 14px;
            color: #86909c;
        }

        /* 表单组 */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #4e5969;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            height: 44px;
            padding: 0 15px;
            border: 1px solid #c9cdd4;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .form-group input:focus {
            border-color: #165DFF;
            outline: none;
            box-shadow: 0 0 0 2px rgba(22, 93, 255, 0.1);
        }
        .form-group input::placeholder {
            color: #c9cdd4;
        }

        /* 辅助操作区 */
        .form-extra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 13px;
        }
        .remember-me {
            display: flex;
            align-items: center;
            color: #4e5969;
        }
        .remember-me input {
            margin-right: 6px;
        }

        /* 登录按钮 */
        .login-btn {
            width: 100%;
            height: 48px;
            background-color: #165DFF;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .login-btn:hover {
            background-color: #0d47a1;
        }

        /* 注册链接 */
        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #86909c;
        }
        .register-link a {
            color: #165DFF;
            text-decoration: none;
        }
        .register-link a:hover {
            text-decoration: underline;
        }

        /* 错误提示 */
        .error-msg {
            background-color: #fef0f0;
            color: #f53f3f;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
            border: 1px solid #fde2e2;
        }

        /* 底部版权 */
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #c9cdd4;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-title">
            <h1>房价可视化系统</h1>
            <p>用户登录</p>
        </div>

        <!-- 错误提示区域 -->
        {% if messages %}
            {% for msg in messages %}
                <div class="error-msg">{{ msg }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">账号</label>
                <input type="text" id="username" name="username" placeholder="请输入您的用户名" required>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入您的密码" required>
            </div>

            <div class="form-extra">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">记住我</label>
                </div>
            </div>

            <button type="submit" class="login-btn">登录</button>
        </form>

        <div class="register-link">
            还没有账号？<a href="{% url 'register' %}">立即注册</a>
        </div>
    </div>

    <div class="footer">
        © 2026 基于Django的房价数据可视化系统 | 高志曦毕业设计
    </div>
</body>
</html>
